[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uds-access-control-audit"
version = "0.1.0"
description = "Vendor-neutral UDS access-control comparison tool for authorized ECU lab testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Mojtaba Fattah Damavandi"}
]
keywords = ["UDS", "CAN", "ISO-TP", "automotive-security", "ECU", "security-testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

[project.optional-dependencies]
hardware = [
  "udsoncan>=1.23",
  "python-can>=4.4",
  "can-isotp>=2.0",
]

[project.scripts]
uds-audit = "uds_access_control_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
